[build-system]
# The build backend and what it needs to build your package
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl"            
version = "0.1.0"              
description = "Machine learning models for NFL"
readme = "README.md"          
license = { file = "LICENSE" }   
authors = [
  { name = "Syam Evani", email = "syamevani@gmail.com" }
]
# (optional) Who maintains it (if different from author)
maintainers = [
  { name = "Syam Evani", email = "syamevani@gmail.com" }
]
requires-python = ">=3.12"          # the minimum Python version you support
keywords = ["machine-learning", "simulation", "utils"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "lightgbm==4.6.0",
  "matplotlib>=3.10.6",
  "numpy>=2.3.3",
  "pandas>=2.3.2",
  "pyarrow==23.0.1",
  "polars==1.35.2",
  "scikit-learn>=1.7.2",
  "scipy>=1.16.3",
  "torch==2.10.0",
  "tqdm>=4.67.1",
]

[project.optional-dependencies]
tuning = ["ray[train,tune]==2.59.0"]
tracking = ["mlflow==3.17.1"]
notebooks = ["ipykernel>=6.30.1", "ipympl>=0.9.8", "kaggle>=1.7.4.5", "seaborn>=0.13.2"]
legacy = ["catboost>=1.2.8", "xgboost>=3.0.5", "torchvision==0.25.0", "pip-tools>=7.5.0"]

[project.scripts]
# command = "module:function"
nfl = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "audit_data", "coverage_labels", "dataset", "dataset_io", "development", "development_features", "evaluate", "model_bundle", "training", "benchmark", "inference_data", "football_features", "experiment", "calibrate", "final_report", "coverage_display", "load_data", "clean_data", "create_features", "train_transformer", "generate_predictions", "process_predictions"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 200
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",   # general pep8 error rules (formatting)
  "F",   # pyflakes (logic/correctness)
  "B",   # bugbear (logic traps)
  "I",   # isort-like import rules (import org)
  "UP",  # pyupgrade (modern syntax)
  "ANN", # type annotation rules
]

ignore = [
  "E203", # makes it compat with Black-style slicing
  "E501", # ignore line length
]

[tool.ruff.lint.isort]
known-first-party = ["nfl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[dependency-groups]
dev = [
    "ruff==0.14.7",
    "pre-commit==4.5.0",
    "pyright>=1.1",
    "pytest>=8",
    "uv==0.12.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: bounded real-data or GPU checks"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/cli.py", "src/audit_data.py", "src/common/paths.py", "src/dataset.py", "src/coverage_labels.py", "src/evaluate.py", "src/models/baselines.py", "src/dataset_io.py", "src/development.py", "src/development_features.py", "src/model_bundle.py", "src/training.py", "src/models/transformer.py", "src/train_transformer.py", "src/generate_predictions.py", "src/benchmark.py", "src/inference_data.py", "src/models/factory.py", "src/models/temporal.py", "src/football_features.py", "src/experiment.py", "src/calibrate.py", "src/models/tabular.py", "src/final_report.py", "src/coverage_display.py", "scripts/integration_check.py"]
typeCheckingMode = "standard"

[tool.uv]
required-version = ">=0.12.17,<0.13"
