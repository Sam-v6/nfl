name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run isolated real-data integration
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-verification:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: test-model-training-and-prediction-generation
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest -q -m 'not integration'
      - run: uv run nfl --help

  data-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - name: Audit read-only inputs in an isolated run
        run: >-
          uv run nfl audit
          --data-root /home/sam/repos/hobby-repos/nfl/data/parquet
          --run-dir "$RUNNER_TEMP/nfl-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
