name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run isolated real-data integration
        type: boolean
        default: false

      gpu:
        description: Also use CUDA for integration (run only when rendering is idle)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-verification:
    name: test-model-training-and-prediction-generation
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.17"
          python-version: "3.12"
          tool-bin-dir: ${{ runner.temp }}/nfl-uv-tools
      - run: uv --version
      - run: uv sync --locked --extra tuning
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest -q -m 'not integration'
      - run: uv run nfl --help

  data-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.17"
          python-version: "3.12"
          tool-bin-dir: ${{ runner.temp }}/nfl-uv-tools
      - run: uv --version
      - run: uv sync --locked --extra tuning
      - name: Verify real-data preparation, training, recovery and predictions
        env:
          NFL_DEVICE: ${{ inputs.gpu && 'cuda' || 'cpu' }}
        run: >-
          uv run python scripts/integration_check.py
          --data-root /home/sam/repos/hobby-repos/nfl/data/parquet
          --run-dir "$RUNNER_TEMP/nfl-integration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --device "$NFL_DEVICE"
      - name: Verify actual Ray Tune checkpoint reporting
        run: uv run pytest -q tests/test_tune_smoke.py -m integration
